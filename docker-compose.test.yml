# Standalone, disposable integration environment. Do not merge with production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: typr_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: typr_texts_test
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./supabase/db/init.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "typr_test", "-d", "typr_texts_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [test]

  test-runner:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test-runner
    working_dir: /workspace
    environment:
      DATABASE_URL: postgresql+psycopg://typr_test:local_test_only@postgres:5432/typr_texts_test
      JWT_SECRET: local-integration-test-only
      TYPR_POSTGRES_INTEGRATION: "1"
      PYTHONPATH: /workspace/backend
      PYTHONDONTWRITEBYTECODE: "1"
      TYPR_TEST_FAIL_AFTER_SMOKE: "${TYPR_TEST_FAIL_AFTER_SMOKE:-0}"
      TYPR_TEST_AUTH_ONLY: "${TYPR_TEST_AUTH_ONLY:-0}"
    volumes:
      - ./backend/app:/workspace/backend/app:ro
      - ./backend/alembic:/workspace/backend/alembic:ro
      - ./backend/alembic.ini:/workspace/backend/alembic.ini:ro
      - ./backend/tests:/workspace/backend/tests:ro
      - ./supabase/db/init.sql:/workspace/supabase/db/init.sql:ro
    command:
      - /bin/sh
      - -ec
      - |
        python -c 'import sys; sys.path.insert(0, "backend/tests/integration"); from test_text_postgresql import require_local_fixture; require_local_fixture()'
        python -m backend.tests.fixtures.check_migrations
        python -m app.commands.migrate
        python backend/tests/fixtures/smoke_stack.py
        [ "$$TYPR_TEST_FAIL_AFTER_SMOKE" != 1 ] || exit 19
        if [ "$$TYPR_TEST_AUTH_ONLY" = 2 ]; then
          exec python -m behave --tags=@sessions backend/tests/features
        fi
        python -m behave --tags=@auth backend/tests/features
        [ "$$TYPR_TEST_AUTH_ONLY" != 1 ] || exit 0
        python -m unittest discover -s backend/tests/services/texts_handler -v
        python -m unittest discover -s backend/tests/integration -v
        python -m unittest discover -s backend/tests -v
    depends_on:
      postgres:
        condition: service_healthy
    networks: [test]

networks:
  test:
    internal: true
