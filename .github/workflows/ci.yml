name: CI

on:
  pull_request:
    branches: [main]

jobs:
  frontend-tests:
    name: frontend-tests
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  frontend-lint:
    name: frontend-lint
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  behave-tests:
    name: behave-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Install Cucumber and Chromium
        working-directory: frontend/e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run backend Gherkin suite
        id: backend-gherkin
        run: scripts/test-stack --behave

      - name: Run browser Gherkin suite
        id: browser-gherkin
        if: ${{ !cancelled() && (steps.backend-gherkin.outcome == 'success' || steps.backend-gherkin.outcome == 'failure') }}
        env:
          TYPR_BROWSER_RESULTS: ${{ runner.temp }}/typr-browser-raw
        run: |
          mkdir -m 700 "$TYPR_BROWSER_RESULTS"
          if ! bash scripts/test-registration-browser --format "message:$TYPR_BROWSER_RESULTS/results.ndjson" \
            >"$TYPR_BROWSER_RESULTS/browser.log" 2>&1; then
            echo "::error::Browser Gherkin failed; see the sanitized failure artifact."
            exit 1
          fi

      - name: Prepare safe browser failure artifacts
        id: browser-artifacts
        if: ${{ failure() && steps.browser-gherkin.outcome == 'failure' }}
        run: |
          python3 frontend/e2e/stage-failure-artifacts.py \
            "$RUNNER_TEMP/typr-browser-raw" "$RUNNER_TEMP/typr-browser-upload"

      - name: Upload browser failure artifacts
        if: ${{ failure() && steps.browser-artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: typr-browser-failure
          path: ${{ runner.temp }}/typr-browser-upload/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary browser artifacts
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/typr-browser-raw" "$RUNNER_TEMP/typr-browser-upload"

  websocket-latency-tests:
    name: websocket-latency-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Measure ten-client WebSocket latency (TC-AUTO-02)
        continue-on-error: true
        run: bash scripts/report-ci-latency scripts/test-stack --latency

  backend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: backend

  docker-build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
