name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Crear .env
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> backend/.env
          echo "GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}" >> backend/.env

      - name: Construir contenedores
        run: docker compose build

      - name: Aplicar migraciones
        run: docker compose run --rm --no-deps backend python -m app.commands.migrate

      - name: Levantar contenedores
        run: docker compose up -d --remove-orphans
